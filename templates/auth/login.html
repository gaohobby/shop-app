{% extends "base.html" %}

{% block title %}登录{% endblock %}

{% block content %}
  <h1>登录</h1>
  <form method="post">
    <p>用户名：<input type="text" name="username"></p>
    <p>密码：<input type="password" name="password"></p>
    <button type="submit">登录</button>
  </form>

  <p>没有账号？<a href="{{ url_for('auth.register') }}">去注册</a></p>
{% endblock %}
